            <p class="centro_redonda">* * *</p>
            <p class="parrafo">El presente Convenio entrará en vigor el 31 de enero de 2019, último día del mes siguiente a la fecha de recepción de la última notificación transmitida por vía diplomática del cumplimiento por cada una de las Partes de los procedimientos internos requeridos, según se establece en su artículo XIII.</p>
            <p class="parrafo_2">Madrid, 13 de diciembre de 2018.–El Secretario General Técnico, José María Muriel Palomino.</p>
